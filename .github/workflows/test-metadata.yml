name: Metadata regression tests
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', 'player/**', '.github/workflows/test-metadata.yml', '.github/workflows/sync-meta.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'player/**', '.github/workflows/sync-meta.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tests/run_all.sh

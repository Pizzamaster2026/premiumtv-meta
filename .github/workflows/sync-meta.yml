name: Sync TMDB-Metadaten

# 02:00 UTC = 03:00 Europe/Berlin im Winter (MEZ, UTC+1)
#           = 04:00 Europe/Berlin im Sommer (MESZ, UTC+2)
# GitHub-Cron kennt keine Zeitzonen, daher dieser Kompromiss.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-meta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # ref: main, not the trigger commit: a queued run (concurrency group) would
      # otherwise start from a stale commit and conflict with what the previous
      # run pushed (run 45006009953: status.json conflict, TMDB results lost).
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Metadaten abgleichen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PTV_URL: ${{ secrets.PTV_URL }}
          PTV_USER: ${{ secrets.PTV_USER }}
          PTV_PASS: ${{ secrets.PTV_PASS }}
          ONE_URL: ${{ secrets.ONE_URL }}
          ONE_USER: ${{ secrets.ONE_USER }}
          ONE_PASS: ${{ secrets.ONE_PASS }}
          # Cap for TMDB lookups. The script also shrinks this automatically
          # to (120 min job limit minus time already spent on list fetches
          # minus a write/commit margin), so a slow PremiumTV list cannot
          # push the job past the timeout.
          SYNC_TIME_BUDGET_MIN: "100"
          SYNC_JOB_TIMEOUT_MIN: "120"
          SYNC_JOB_MARGIN_MIN: "12"
          # Large list endpoints (especially PremiumTV) may need several
          # minutes. Override per provider with SYNC_LIST_TIMEOUT_PREMIUMTV_SEC
          # / SYNC_LIST_RETRIES_PREMIUMTV if needed.
          SYNC_LIST_TIMEOUT_SEC: "300"
          SYNC_LIST_RETRIES: "2"
          # PremiumTV blocks GitHub's IP ranges. The PremiumTV Manager app
          # uploads data/titles_premiumtv.json.gz (titles only, no logins, no
          # stream URLs). If that file is at most this many days old, the
          # server is not contacted for PremiumTV at all.
          SYNC_TITLES_MAX_AGE_DAYS: "7"
          # data/sport.json is built by its own workflow (sync-sport.yml,
          # every 6 h), so the two jobs never push the same file.
          SYNC_SPORT: "0"
          # Live progress for the Manager: force-push data/status.json to the
          # 'status' branch every 4 minutes. Does not touch main mid-run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_STATUS_BRANCH: status
          SYNC_STATUS_PUSH_SEC: "240"
        run: python3 scripts/sync_meta.py --data-dir data

      # always(): also run after a timeout/cancel, so a mid-run checkpoint
      # already written to disk can still be committed.
      - name: Änderungen übernehmen
        if: always()
        run: |
          rm -f data/.changed
          # Every tracked file the sync rewrote, plus outputs that may be new/untracked.
          # data/status.json is also written by the adult-covers job; write_status keeps
          # its 'adult' counts. scripts/git_publish.sh: --autostash, retries on push
          # races, our fresh output wins a conflict, a final failure turns this step red.
          git add -u data/
          files=""
          for f in data/index.json data/status.json data/adult-titles.json data/meta.json data/meta-*.json; do
            if [ -e "$f" ]; then files="$files $f"; fi
          done
          bash scripts/git_publish.sh "chore: TMDB-Metadaten aktualisieren" ${files:-data/status.json}

  # Adult covers from ThePornDB (only for titles the sync marks as adult).
  # Separate job so it can never eat into the TMDB time budget. The run stays
  # green (job-level continue-on-error, the script always exits 0), so the
  # customer export (workflow_run on success) still runs. A failed push of the
  # results makes THIS job red (visible), see scripts/git_publish.sh.
  adult-covers:
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Repository auschecken (aktueller Stand nach dem Abgleich)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Erwachsenen-Cover (TPDB) abgleichen
        continue-on-error: true
        timeout-minutes: 32
        env:
          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
          # ~1 request per second, cap per run; the rest waits for the next night.
          TPDB_MIN_INTERVAL_SEC: "1.0"
          TPDB_MAX_REQUESTS: "1500"
          TPDB_BUDGET_MIN: "28"
          # Update data/status.json (and the live 'status' branch) for the Manager bar.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_STATUS_BRANCH: status
          SYNC_STATUS_PUSH_SEC: "30"
        run: python3 scripts/adult_tpdb.py --data-dir data

      # Customer export right here, so the adult map lands together with the
      # cache it is built from (the separate "Build customer metadata cache"
      # workflow runs again afterwards and then finds nothing new). Only reads
      # files in data/, no network.
      - name: Kunden-Export mit Erwachsenen-Map
        id: export
        continue-on-error: true
        run: python3 scripts/export_client.py --data-dir data

      # NO continue-on-error here: if the results cannot be pushed, this step and
      # the adult-covers job turn red. The run itself stays green (job-level
      # continue-on-error), so the TMDB sync and the customer export are unaffected.
      # Commits ALL outputs of this job; other dirty files are autostashed.
      - name: Änderungen übernehmen
        run: |
          paths="data/adult-tpdb.json data/status.json"
          if [ "${{ steps.export.outcome }}" = "success" ]; then
            paths="$paths data/client-v1"
          else
            echo "::warning::Kunden-Export fehlgeschlagen – nur TPDB-Cache und Status werden übernommen."
          fi
          bash scripts/git_publish.sh "chore: Erwachsenen-Cover (TPDB) aktualisieren" $paths

name: Build customer metadata cache
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/export_client.py', 'scripts/title.py', '.github/workflows/export-client.yml']
  workflow_run:
    workflows: ['Sync TMDB-Metadaten']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: customer-metadata-export
  cancel-in-progress: false
jobs:
  export:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export locally without provider or TMDB calls
        run: python3 scripts/export_client.py --data-dir data
      # Derived files only: on a conflict scripts/git_publish.sh rebuilds the export on top
      # of the newest main (PUBLISH_REGEN) instead of overwriting newer covers/metadata.
      - name: Publish complete cache generation
        env:
          PUBLISH_REGEN: python3 scripts/export_client.py --data-dir data
        run: |
          bash scripts/git_publish.sh 'chore: publish compact customer metadata cache' data/client-v1

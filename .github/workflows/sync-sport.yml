name: Sportplan aktualisieren

# Every 6 hours (UTC). One xmltv.php request, no TMDB, no list fetch.
# Keeps data/sport.json younger than the player's 36 h limit even if the
# nightly TMDB sync is slow or skipped.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sport
  cancel-in-progress: true

jobs:
  sport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sportplan bauen
        env:
          ONE_URL: ${{ secrets.ONE_URL }}
          ONE_USER: ${{ secrets.ONE_USER }}
          ONE_PASS: ${{ secrets.ONE_PASS }}
          SYNC_SPORT_DAYS: "3"
          SYNC_SPORT_BUDGET_SEC: "300"
        run: python3 scripts/sync_meta.py --data-dir data --sport-only

      # Only data/sport.json; scripts/git_publish.sh: --autostash, retries on push races,
      # a final failure turns this step red.
      - name: Änderungen übernehmen
        run: |
          bash scripts/git_publish.sh "chore: Sportplan aktualisieren" data/sport.json
